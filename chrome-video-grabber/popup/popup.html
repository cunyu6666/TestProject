<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Grabber</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img class="brand-icon" src="../icons/icon48.png" alt="" width="28" height="28" />
        <div class="brand-text">
          <h1 class="brand-name">Video Grabber</h1>
          <p class="brand-sub">通用 + Bilibili 视频链接</p>
        </div>
      </div>
      <button type="button" id="refresh-btn" class="refresh-btn" title="刷新">
        刷新
      </button>
    </header>

    <main class="main">
      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">检测到的视频</h2>
          <span id="count-badge" class="count-badge" hidden>0</span>
        </div>

        <ul id="video-list" class="video-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state">
          <p class="empty-title">暂无视频链接</p>
          <p class="empty-hint">
            在任意页面播放或加载视频后打开此弹窗。将检测 &lt;video&gt; / &lt;source&gt;、常见直链，以及 Bilibili playurl / DASH / bilivideo CDN。
          </p>
        </div>

        <p id="status-line" class="status-line" hidden></p>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-note">Bilibili 已接入 · DASH 音视频分列 · 无合并</span>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
